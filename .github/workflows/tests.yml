name: CI Tests

on:
  push:
    branches: [ "main", "master", "develop", "ci-test-failure", "ci-test-success" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Run Test Suite
      id: run-tests
      continue-on-error: true
      run: |
        bash -x ./instalar.sh --test > ci_log.txt 2>&1
        
    - name: Commit log
      run: |
        git config --global user.name "CI"
        git config --global user.email "ci@example.com"
        git add ci_log.txt
        git commit -m "Upload CI log" || true
        git push
